
[project]
name = "czi-minimal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "composer[streaming]>=0.32.1",
    "datasets>=4.4.1",
    "hydra-core>=1.3.2",
    "mosaicml>=0.3.1",
    "numpy<2.3.0",
    "torch==2.7.0",
    "flash-attn>=2.8.0.post2",
    "wandb>=0.23.0",
    "zstandard>=0.25.0",
    "mamba-ssm[causal-conv1d]>=2.2.6.post3",
    "optree>=0.18.0",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
mamba-ssm = [{ requirement = "torch", match-runtime = true }]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]


[tool.uv.workspace]
members = [
    "src/caduceus",
    "src/hnet",
]
