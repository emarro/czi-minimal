# @package _global_
# let the experiment node modify configs globally
defaults:
  - override /model: mlm_large_kmer
  - override /trainer: fixed_batch
  - override /dataset: pcad2
  - override /eval_dataset: clinvar
  - override /loggers: wandb

tags: ["baseline", "kmer", "hg38", "8k"]

hydra:
  mode: "MULTIRUN"
  sweeper:
    # hyperparams to search over
    params:
      model.k: 6, 2, 3



task_name: "kmer_pcad2_8k"

model:
  max_seq_len: 8192

optimizer:
  lr: 5e-4

trainer:
  max_duration: "25ep"
  global_train_batch_size: 512 # set small for debugging
  device_train_microbatch_size: 8 # max size for the small model on 48Gb card (6000ada), 16 for h100 



loggers:
  wandb:
    project: "Hnet hg38"
    tags: ${tags}
