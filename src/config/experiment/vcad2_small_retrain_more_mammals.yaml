# @package _global_
# let the experiment node modify configs globally
defaults:
  - override /model: vcad2_small_from_pretrained
  - override /trainer: fixed_batch
  - override /dataset: more_mammals
  - override /eval_dataset: clinvar
  - override /loggers: wandb


tags: ["mlm", "vad2", "extension", "more_mammals"]

task_name: "vcad2_pretrained_extension_more_mammals"

optimizer:
  lr: 5e-4

trainer:
  device_train_microbatch_size: 4  #depends on the amount of GPU mem available
  max_duration: "25ep"
  eval_interval: "1250ba"  # Evaluate every 5k batches
  global_train_batch_size: 64
  save_interval: "250ba"


    
loggers:
  wandb:
    project: "G2 vcad2"
    tags: ${tags}
