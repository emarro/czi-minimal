# @package _global_
# let the experiment node modify configs globally
defaults:
  - override /loggers: wandb
  - override /trainer: fixed_batch
  - override /model: pcad2_small
  - override /dataset: hg38_8192
  - override /eval_dataset: clinvar



tags: ["cnet", "baseline", "hg38"]



task_name: "pcad2_baseline"

optimizer:
  lr: 5e-4

trainer:
  global_train_batch_size: 512 # set small for debugging
  device_train_microbatch_size: 8 # max size for the small model on 48Gb card (6000ada), 16 for h100 
  save_interval: "25ba" # with above settings, ckpts every ~500M tokens
  max_duration: "5ep" #"500ba"  # Train for 50 epochs

loggers:
  wandb:
    project: "Hnet hg38"
    tags: ${tags}