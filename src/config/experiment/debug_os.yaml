# @package _global_
# let the experiment node modify configs globally
defaults:
  - override /model: os_small
  - override /trainer: fixed_batch
  #- override /loggers: wandb

model:
  mlm: True

task_name: "debug_cnet"

optimizer:
  lr: 5e-4

trainer:
  device_train_microbatch_size: 32  #depends on the amount of GPU mem available
  max_duration: "15ba"
  eval_interval: "20ba"  # Evaluate every 5k batches
  global_train_batch_size: 32
  save_overwrite: True
  autoresume: False
  reset_time: True

