# @package _global_
# let the experiment node modify configs globally
defaults:
  - override /model: hnet_large
  - override /trainer: fixed_batch
  - override /dataset: pcad2
  - override /loggers: wandb

tags: ["hnet", "vary_N", "hg38", "ar"]

hydra:
  mode: "MULTIRUN"
  sweeper:
    # hyperparams to search over
    params:
      model.default_target_ratio: 2, 3, 5, 6, 10, 15, nill



task_name: "sweep_N_pcad2_8k"

optimizer:
  lr: 5e-4

trainer:
  max_duration: "25ep"
  global_train_batch_size: 512 # set small for debugging
  device_train_microbatch_size: 4 # max size for the small model on 48Gb card (6000ada), 16 for h100 



loggers:
  wandb:
    project: "Hnet pcad2"
    tags: ${tags}
