# @package _global_
# let the experiment node modify configs globally
defaults:
  - override /model: pcad2_small
  #- override /loggers: wandb
  - override /dataset: pcad2
  - override /trainer: fixed_batch


tags: ["cnet", "baseline"]



task_name: "cad2_baseline"

optimizer:
  lr: 5e-4

trainer:
  global_train_batch_size: 32 # set small for debugging
  device_train_microbatch_size: 8 # max size for the small model on 48Gb card (6000ada)

