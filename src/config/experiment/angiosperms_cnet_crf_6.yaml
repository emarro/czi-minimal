# @package _global_
# let the experiment node modify configs globally
defaults:
  - override /model: cnet_small_crf
  - override /trainer: fixed_batch
  - override /loggers: wandb

model:
  mlm: True
  tokenizer: "dna"
  default_target_ratio: 6

task_name: "angiosperms_cnet"

optimizer:
  lr: 5e-4
dataset:
  eval_interval: "2000ba"

trainer:
  device_train_microbatch_size: 128  #depends on the amount of GPU mem available
  max_duration: "5ep"
  eval_interval: "1ep"  # Evaluate every 5k batches
  global_train_batch_size: 2048
  save_overwrite: False
  autoresume: True
  reset_time: False

loggers:
  wandb:
    project: "Cnet Angiosperms"
