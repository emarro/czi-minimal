_target_: wrappers.hnet.build_model
_convert_: "all"
_modelstr_: "cnet_${.arch_layout}_D=${.d_model}_base"

arch_layout: ["C3T1C4C15C4"] #architecture for DNA from Table 7 with best PPL in HNet paper
d_model: [512] #d_model of each stage (matches stages from arch_layout)
d_intermediate: [768] # size of FFN sizes corresponding to above
vocab_size: 260
ssm_cfg:
  chunk_size: 256
  d_conv: 4
  d_state: 128
  expand: 2
attn_cfg:
  num_heads: [8]
  rotary_emb_dim: [32]
  window_size: [-1]
tie_embeddings: False

pad_token_id: -100  # [PAD] token ID
ratio_loss_weight: null #alpha from the paper
use_return_dict: False

# Meta variables, not used in HNetConfig directly
default_target_ratio: null
max_seq_len: 512
mlm: True
log_bpreds: False
tokenizer: "byte"
