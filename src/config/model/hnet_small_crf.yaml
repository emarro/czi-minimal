_target_: wrappers.hnet.build_model
_convert_: "all"
_modelstr_: "hnet_${.arch_layout}_N=${.default_target_ratio}_D=${.d_model}_${.selection}_fixed"

arch_layout: ["m3t1m4",["M20"],"m4"] #architecture for DNA from Table 7 with best PPL in HNet paper
d_model: [512, 512] #d_model of each stage (matches stages from arch_layout)
d_intermediate: [768, 768] # size of FFN sizes corresponding to above
vocab_size: 260
selection: "shannon-lc-CRF"
ssm_cfg:
  chunk_size: 256
  d_conv: 4
  d_state: 128
  expand: 2
attn_cfg:
  num_heads: [8, 8]
  rotary_emb_dim: [32, 32]
  window_size: [-1, -1]
tie_embeddings: False

pad_token_id: -100  # [PAD] token ID
ratio_loss_weight: 0.03 #alpha from the paper
use_return_dict: False

# Meta variables, not used in HNetConfig directly
default_target_ratio: 3
max_seq_len: 512
mlm: False
log_bpreds: True
tokenizer: "byte" #byte, dna, or kmer
